name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request supersedes the run in progress. Runs for main are never cancelled,
# so that every commit that lands there keeps its own result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      # Report both platforms even when one fails: the library keeps its state differently on each
      # (Windows named sections vanish with their last handle, Linux files in /dev/shm persist).
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    defaults:
      run:
        # One shell on both platforms keeps quoting of the filter expressions identical.
        shell: bash

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore InterprocessMemory.sln

      # Builds every project, including the benchmarks and the child-process test worker that the
      # cross-process tests start. Packing on every build is not needed here.
      - name: Build
        id: build
        run: dotnet build InterprocessMemory.sln --configuration Release --no-restore -p:GeneratePackageOnBuild=false

      # The blame collector (enabled by --blame-hang-timeout) names the running test when the test host
      # dies, which is what an AccessViolationException from a memory-mapped region looks like; the hang
      # timeout stops a stuck test from holding the runner until the job timeout.
      - name: Test
        run: >
          dotnet test InterprocessMemory.Tests/InterprocessMemory.Tests.csproj
          --configuration Release --no-build
          --filter "Category!=TimingSensitive&Category!=LongRunning"
          --blame-hang-timeout 10m --blame-hang-dump-type none
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      # Tests marked LongRunning (minutes each) are explicit-only and are left to manual runs.
      #
      # Tests whose outcome depends on the core count and the scheduler. They still run and show up
      # in the log and the artifact, but a failure here does not fail the job.
      - name: Test (timing sensitive, informational)
        id: timing
        if: ${{ !cancelled() && steps.build.conclusion == 'success' }}
        continue-on-error: true
        run: >
          dotnet test InterprocessMemory.Tests/InterprocessMemory.Tests.csproj
          --configuration Release --no-build
          --filter "Category=TimingSensitive"
          --blame-hang-timeout 5m --blame-hang-dump-type none
          --logger "trx;LogFileName=timing-sensitive-results.trx"
          --results-directory TestResults

      # continue-on-error shows a failed step as a success, so say it out loud: a warning annotation on the
      # run and a section in its summary. Otherwise a test that fails on every run looks green for ever.
      - name: Report timing sensitive failures
        if: ${{ !cancelled() && steps.timing.outcome == 'failure' }}
        run: |
          echo "::warning title=Timing sensitive tests failed on ${{ matrix.os }}::This step does not fail the job. See the step log and timing-sensitive-results.trx in the test-results artifact."
          {
            echo "### Timing sensitive tests failed on ${{ matrix.os }}"
            echo ""
            echo "These tests depend on scheduling and do not fail the job, but a failure is still a result to read: see the log of the step above and the test-results artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          if-no-files-found: ignore
